substitutions:
  friendly_name: Tesla BLE
  device_name: tesla-ble
  device_description: Interact with Tesla vehicles over BLE using ESPHome and Home Assistant

packages:
  board: !include board.yml
  common: !include common.yml
  project: !include project.yml
  # listener: !include listener.yml # Uncomment this to scan find your VIN BLE MAC address

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  comment: ${device_description}
  project:
    name: yoziru.esphome-tesla-ble
    version: "2026.6.9"

logger:
  level: INFO

api:
  reboot_timeout: 0s   # laeuft auch ohne verbundenes Home Assistant dauerhaft
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

# Web-Interface im Browser (wie beim Heltec Garage): http://192.168.20.44
web_server:
  port: 80
  version: 3
  js_include: "www/lohates.js"
  auth:
    username: admin
    password: !secret web_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret wifi_hotspot_password

captive_portal:
